[pytest]
# El código de las Lambdas se importa igual que en AWS: "import todoList"
pythonpath = src
# Por defecto solo los tests unitarios; los de integración necesitan BASE_URL
testpaths = test/unit
markers =
    api: pruebas de API, requieren la aplicación desplegada (BASE_URL)
    readonly: pruebas de integración que se ejecutan en producción
    writeonly: pruebas de integración que solo se ejecutan en staging
