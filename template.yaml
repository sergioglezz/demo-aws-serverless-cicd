AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  todo-list-aws: API REST serverless de lista de tareas
  (API Gateway + AWS Lambda + DynamoDB)

Parameters:
  Stage:
    Type: String
    Default: default
    AllowedValues:
      - default
      - staging
      - production
    Description: Entorno de despliegue (staging o production)

  LambdaRoleName:
    Type: String
    Default: LabRole
    Description: >
      Rol IAM existente para las funciones. AWS Academy no permite crear roles,
      así que por defecto se usa LabRole. Si se deja vacío, SAM crea un rol por
      función con los permisos mínimos sobre la tabla de DynamoDB.

Conditions:
  CreateFunctionRoles: !Equals [!Ref LambdaRoleName, ""]

Globals:
  Function:
    CodeUri: src/
    Runtime: python3.12
    Timeout: 3
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref TodosDynamoDbTable
        ENDPOINT_OVERRIDE: ""
  Api:
    # Límite de peticiones para frenar abusos de una API pública
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

Resources:
  CreateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create.create
      Role: !If
        - CreateFunctionRoles
        - !Ref AWS::NoValue
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosDynamoDbTable
      Events:
        CreateTodo:
          Type: Api
          Properties:
            Path: /todos
            Method: post

  ListTodosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: list.list
      Role: !If
        - CreateFunctionRoles
        - !Ref AWS::NoValue
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TodosDynamoDbTable
      Events:
        ListTodos:
          Type: Api
          Properties:
            Path: /todos
            Method: get

  GetTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get.get
      Role: !If
        - CreateFunctionRoles
        - !Ref AWS::NoValue
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TodosDynamoDbTable
      Events:
        GetTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: get

  UpdateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: update.update
      Role: !If
        - CreateFunctionRoles
        - !Ref AWS::NoValue
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosDynamoDbTable
      Events:
        UpdateTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: put

  DeleteTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: delete.delete
      Role: !If
        - CreateFunctionRoles
        - !Ref AWS::NoValue
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosDynamoDbTable
      Events:
        DeleteTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: delete

  TodosDynamoDbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}-TodosDynamoDbTable"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

Outputs:
  # ServerlessRestApi es la API que SAM crea implícitamente a partir de los
  # eventos de tipo Api de las funciones
  BaseUrlApi:
    Description: URL base de la API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CreateTodoApi:
    Description: "Endpoint para crear una tarea (POST)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos/"
  ListTodosApi:
    Description: "Endpoint para listar las tareas (GET)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos"
  GetTodoApi:
    Description: "Endpoint para consultar una tarea (GET)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos/{id}"
  UpdateTodoApi:
    Description: "Endpoint para modificar una tarea (PUT)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos/{id}"
  DeleteTodoApi:
    Description: "Endpoint para borrar una tarea (DELETE)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos/{id}"
